name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android project
        run: |
          echo "Checking project files..."
          pwd
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "ERROR: app folder is missing."
            exit 1
          fi

          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle is missing."
            exit 1
          fi

          echo "Android project looks correct."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VendorOS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
